name: Claude Merge
# Conclui (merge) PRs aprovados pelo Code Review do Claude e sem conflitos.
# Opt-in: só atua em PRs com a label "claude-merge".
# Disparo: label "claude-merge", fim dos workflows "Code Review" ou "Build", manual (Actions > Run workflow)
# ou schedule a cada 15 min, que reavalia os PRs rotulados (ex.: outro check obrigatório terminou depois do Code Review).
# Critérios: PR aberto e fora de draft, Code Review e Build com sucesso no commit atual (head),
# aprovação humana se tocar caminho de .github/sensiveis.txt,
# nenhuma thread de review pendente, nenhum "changes requested" e sem conflitos.
# Se houver conflito, aciona o workflow "Claude Resolve Conflicts" (exceto no schedule, para não reacionar em loop).
# O merge usa o secret CLAUDE_PUSH_TOKEN (PAT/App) quando existir, para que o push na base dispare
# os workflows dela; com o GITHUB_TOKEN o GitHub não dispara workflows no push do merge.
# PRs de fork: o merge funciona, mas a resolução automática de conflitos não (exige push na branch do PR).
on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: ["Code Review", "Build"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR"
        required: true
        type: number

jobs:
  lista:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-merge') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.pr.outputs.prs }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Identifica os PRs
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          PR_EVENT: ${{ github.event.pull_request.number || inputs.pr_number }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            prs=$(gh pr list -R "$REPO" --label claude-merge --state open --json number --jq '[.[].number]')
          else
            pr="$PR_EVENT"
            if [ -z "$pr" ]; then
              pr=$(echo "$RUN_PRS" | jq -r '.[0].number // empty')
            fi
            if [ -z "$pr" ] && [ -n "$RUN_BRANCH" ]; then
              pr=$(gh pr list -R "$REPO" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // empty')
            fi
            prs=$(jq -cn --arg p "$pr" 'if $p == "" then [] else [$p | tonumber] end')
          fi
          [ "$prs" != "[]" ] || echo "Nenhum PR aberto associado ao evento."
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  merge:
    needs: lista
    if: needs.lista.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.lista.outputs.prs) }}
    # Agrupa pelo número do PR em qualquer evento, serializando execuções sobre o mesmo PR.
    concurrency:
      group: claude-merge-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      PR: ${{ matrix.pr }}
    steps:
      - name: Valida critérios
        id: valida
        run: |
          set -euo pipefail

          # Reporta o motivo do bloqueio; comenta no PR só quando o disparo foi explícito (label/manual).
          bloqueia() {
            echo "PR #$PR não foi concluído: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              gh pr comment "$PR" -R "$REPO" --body "**Claude Merge** — PR não concluído: $1"
            fi
            exit 0
          }

          # mergeable é calculado de forma assíncrona pelo GitHub; aguarda sair de UNKNOWN.
          for i in 1 2 3 4 5 6; do
            info=$(gh pr view "$PR" -R "$REPO" --json state,isDraft,labels,mergeable,mergeStateStatus,reviewDecision,headRefOid,isCrossRepository)
            [ "$(echo "$info" | jq -r .mergeable)" != "UNKNOWN" ] && break
            sleep 10
          done

          state=$(echo "$info" | jq -r .state)
          draft=$(echo "$info" | jq -r .isDraft)
          has_label=$(echo "$info" | jq -r '[.labels[].name] | index("claude-merge") != null')
          mergeable=$(echo "$info" | jq -r .mergeable)
          merge_state=$(echo "$info" | jq -r .mergeStateStatus)
          decision=$(echo "$info" | jq -r '.reviewDecision // ""')
          sha=$(echo "$info" | jq -r .headRefOid)
          fork=$(echo "$info" | jq -r .isCrossRepository)

          if [ "$has_label" != "true" ]; then
            echo "PR #$PR sem a label claude-merge; ignorado."
            exit 0
          fi
          [ "$state" = "OPEN" ] || bloqueia "PR não está aberto ($state)."
          [ "$draft" = "false" ] || bloqueia "PR está em draft."
          [ "$decision" != "CHANGES_REQUESTED" ] || bloqueia "há review pedindo alterações."

          if [ "$mergeable" = "CONFLICTING" ]; then
            [ "$fork" = "false" ] || bloqueia "há conflitos com a base e o PR vem de fork; resolva manualmente."
            [ "$EVENT" != "schedule" ] || bloqueia "há conflitos com a base; aplique a label \`claude-conflitos\` para resolver."
            gh workflow run claude-resolve-conflicts.yml -R "$REPO" -f pr_number="$PR"
            bloqueia "há conflitos com a base; acionei o workflow **Claude Resolve Conflicts**."
          fi
          [ "$mergeable" = "MERGEABLE" ] || bloqueia "GitHub não confirmou que o PR é mesclável ($mergeable)."
          case "$merge_state" in
            CLEAN|HAS_HOOKS) ;;
            *) bloqueia "estado de merge $merge_state (checks falhando, branch desatualizada ou bloqueada)." ;;
          esac

          # Code Review precisa ter rodado com sucesso no commit atual do PR.
          reviews_ok=$(gh api "repos/$REPO/actions/workflows/code-review.yml/runs?head_sha=$sha&status=success" --jq '.total_count')
          [ "$reviews_ok" -gt 0 ] || bloqueia "Code Review do Claude ainda não passou no commit \`${sha:0:7}\`."

          # Build é o check objetivo; o review sozinho não garante que compila.
          build_ok=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$sha&status=success" --jq '.total_count')
          [ "$build_ok" -gt 0 ] || bloqueia "Build ainda não passou no commit \`${sha:0:7}\`."

          # Caminhos sensíveis (.github/sensiveis.txt da base) exigem aprovação de um humano.
          # Lido da base, não do PR, para o PR não conseguir afrouxar a própria regra.
          padroes=$(gh api "repos/$REPO/contents/.github/sensiveis.txt" -H "Accept: application/vnd.github.raw" | grep -v -E '^\s*(#|$)' || true)
          if [ -n "$padroes" ]; then
            sensiveis=$(gh pr diff "$PR" -R "$REPO" --name-only | grep -E -f <(echo "$padroes") || true)
            if [ -n "$sensiveis" ]; then
              aprovado=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '[.[] | select(.user.type == "User" and .commit_id == "'"$sha"'" and .state == "APPROVED")] | length')
              [ "$aprovado" -gt 0 ] || bloqueia "altera caminho sensível e precisa de aprovação humana no commit \`${sha:0:7}\`: $(echo "$sensiveis" | tr '\n' ' ')"
            fi
          fi

          # Apontamentos do review viram threads inline; todas precisam estar resolvidas.
          threads=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:100){pageInfo{hasNextPage} nodes{isResolved}}}}}' \
            -f o="${REPO%/*}" -f n="${REPO#*/}" -F p="$PR" \
            --jq '.data.repository.pullRequest.reviewThreads')
          [ "$(echo "$threads" | jq -r .pageInfo.hasNextPage)" = "false" ] || bloqueia "PR tem mais de 100 threads de review; verifique e faça o merge manualmente."
          pendentes=$(echo "$threads" | jq '[.nodes[] | select(.isResolved | not)] | length')
          [ "$pendentes" -eq 0 ] || bloqueia "há $pendentes thread(s) de review não resolvida(s)."

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.valida.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PUSH_TOKEN || github.token }}
          SHA: ${{ steps.valida.outputs.sha }}
        run: |
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          echo "PR #$PR concluído (merge de \`${SHA:0:7}\`)." | tee -a "$GITHUB_STEP_SUMMARY"
